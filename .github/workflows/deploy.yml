name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: busticket-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check VPS deploy secrets
        if: github.ref == 'refs/heads/main'
        id: deployment
        env:
          SSH_PRIVATE: ${{ secrets.SSH_PRIVATE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        shell: bash
        run: |
          if [[ -n "$SSH_PRIVATE" && -n "$SSH_HOST" && -n "$SERVER_USER" && -n "$SERVER_PORT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VPS deploy skipped; configure SSH_PRIVATE, SSH_HOST, SERVER_USER and SERVER_PORT repository secrets."
          fi

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/main' && steps.deployment.outputs.enabled == 'true'
        env:
          SSH_PRIVATE: ${{ secrets.SSH_PRIVATE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE" > "$key_file"
          chmod 600 "$key_file"
          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H -p "$SERVER_PORT" "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$key_file" -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SSH_HOST" \
            'cd /root/buses && git pull --ff-only origin main && npm ci && npm run build && pm2 startOrReload ecosystem.config.cjs --update-env && pm2 save && nginx -t && systemctl reload nginx && curl --fail --silent --show-error http://127.0.0.1:3009/api/v1/health'
